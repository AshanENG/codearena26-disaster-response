<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="resilientShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="resilientWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="resilientBeacon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Protective Shield Contour -->
  <path d="M 50 12 L 80 25 C 80 58, 50 78, 50 88 C 50 78, 20 58, 20 25 Z" 
        stroke="url(#resilientShield)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="#0284c7"
        fill-opacity="0.08" />

  <!-- Water Wave Contours (River & Flood Resilience) -->
  <path d="M 28 58 Q 39 48, 50 58 T 72 58" 
        stroke="url(#resilientWave)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <path d="M 34 68 Q 42 61, 50 68 T 66 68" 
        stroke="url(#resilientWave)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-opacity="0.75" />

  <!-- Emergency Beacon (Response, Alert & Safety) -->
  <circle cx="50" cy="35" r="7" fill="url(#resilientBeacon)" />
  <path d="M 40 25 A 14 14 0 0 1 60 25" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
</svg>
